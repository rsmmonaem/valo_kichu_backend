[program:valokichu-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/valokichu.com/backend.valokichu.com/artisan queue:work --sleep=3 --tries=3 --daemon
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=3600
user=root
redirect_stderr=true
stdout_logfile=/home/valokichu.com/backend.valokichu.com/storage/logs/laravel-queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
